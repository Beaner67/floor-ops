# Optional: PostgreSQL for production-like runs.
# Then: $env:RI_DATABASE_URL="postgresql+psycopg://ri:ri@localhost:5432/ri"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ri
      POSTGRES_PASSWORD: ri
      POSTGRES_DB: ri
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
